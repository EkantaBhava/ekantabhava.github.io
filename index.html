<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekanta Bhava | Presence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap');

  :root {
    --amber: #C8956C;
    --amber-pale: rgba(200,149,108,0.45);
    --dust: #F2EBE0;
    --dark: #0A0806;
    --dissolve: cubic-bezier(0.4,0,0.2,1);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--dark); color: var(--dust);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden; cursor: none;
  }

  /* ── CUSTOM CURSOR ── */
  #cursor {
    position: fixed; width: 4px; height: 4px;
    background: var(--amber); border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s ease, opacity 0.3s ease;
  }

  /* ── VIDEO FIELD ── */
  #video-wrap {
    position: fixed; inset: 0; z-index: 1;
    opacity: 0;
    transition: opacity 3s var(--dissolve);
  }
  #video-wrap.visible { opacity: 1; }
  #video-wrap.receding {
    opacity: 0;
    transition: opacity 4s var(--dissolve);
  }
  #field-video {
    width: 100%; height: 100%; object-fit: cover;
  }

  /* ── VIGNETTE ── */
  #vignette {
    position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(
      ellipse 85% 80% at 50% 50%,
      transparent 30%,
      rgba(10,8,6,0.55) 70%,
      rgba(10,8,6,0.92) 100%
    );
    pointer-events: none;
  }

  /* ── BLOOM ── */
  #bloom {
    position: fixed; inset: 0; z-index: 3;
    background: radial-gradient(
      ellipse 60% 55% at 50% 50%,
      rgba(200,149,108,0.04) 0%,
      transparent 70%
    );
    pointer-events: none;
    opacity: 0;
    transition: opacity 4s var(--dissolve);
  }
  #bloom.visible { opacity: 1; }

  /* ── PRESENCE LAYER — title sequence ── */
  #presence {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.2rem; pointer-events: none;
  }

  .presence-line {
    opacity: 0; transform: translateY(8px);
    transition: opacity 2.4s var(--dissolve), transform 2.4s var(--dissolve);
    text-align: center;
  }
  .presence-line.visible { opacity: 1; transform: translateY(0); }
  .presence-line.gone {
    opacity: 0; transform: translateY(-6px);
    transition: opacity 1.8s var(--dissolve), transform 1.8s var(--dissolve);
  }

  #greeting {
    font-size: clamp(0.65rem, 1vw, 0.75rem);
    letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--amber-pale);
  }
  #name {
    font-size: clamp(1.6rem, 3.5vw, 2.4rem);
    letter-spacing: 0.18em; font-weight: 300;
    color: var(--dust);
  }
  #tagline {
    font-size: clamp(0.7rem, 1.1vw, 0.82rem);
    letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--amber-pale); font-style: italic;
  }

  /* ── WHAT IS THIS ── */
  #what-prompt {
    position: fixed; left: 50%; bottom: 18%;
    transform: translateX(-50%) translateY(8px);
    z-index: 20;
    font-size: clamp(0.75rem, 1.2vw, 0.88rem);
    letter-spacing: 0.36em; text-transform: uppercase;
    color: var(--amber);
    opacity: 0;
    transition: opacity 2.8s var(--dissolve), transform 2.8s var(--dissolve),
                letter-spacing 0.5s ease;
    pointer-events: none; cursor: pointer;
    padding: 1.4rem 2.8rem;
    text-shadow:
      0 0 40px rgba(10,8,6,0.98),
      0 0 80px rgba(10,8,6,0.85),
      0 0 140px rgba(10,8,6,0.65);
  }
  #what-prompt.visible {
    opacity: 1; transform: translateX(-50%) translateY(0);
    pointer-events: all;
  }
  #what-prompt:hover { letter-spacing: 0.42em; }
  #what-prompt.visible::after {
    content: ''; display: block; margin: 0.55rem auto 0;
    width: 1.2rem; height: 1px;
    background: var(--amber); opacity: 0.4;
    transition: width 0.7s var(--dissolve), opacity 0.5s ease;
  }
  #what-prompt.visible:hover::after { width: 3rem; opacity: 0.8; }

  /* ── CONVERSATION FIELD ── */
  #conversation {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s var(--dissolve);
  }
  #conversation.visible {
    opacity: 1; pointer-events: all;
  }

  /* ── GLACIAL DRIFT PLANE ── */
  #drift-plane {
    position: fixed; inset: 0; z-index: 31;
    pointer-events: none; overflow: hidden;
  }

  .drift-beat {
    position: absolute;
    width: 72%; max-width: 480px;
    left: 50%; transform: translateX(-50%);
    text-align: center;
    font-size: clamp(1.1rem, 2vw, 1.3rem);
    line-height: 1.95; letter-spacing: 0.025em;
    font-weight: 300; color: var(--dust);
    opacity: 0; will-change: transform, opacity;
  }
  .drift-beat em { color: var(--amber); font-style: italic; }
  .drift-beat .accent {
    font-size: clamp(1.3rem, 2.4vw, 1.6rem);
    color: var(--amber); letter-spacing: 0.08em;
  }

  /* ── THRESHOLDS ── */
  #threshold {
    position: fixed; bottom: 32%; left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    display: flex; flex-direction: column;
    align-items: center; gap: 1.4rem;
    opacity: 0; pointer-events: none;
    transition: opacity 2s var(--dissolve);
  }
  #threshold.visible { opacity: 1; pointer-events: all; }

  .threshold-btn {
    background: none; border: none;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(0.68rem, 1.1vw, 0.78rem);
    letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--amber); cursor: pointer;
    transition: color 0.5s ease, letter-spacing 0.4s ease;
    padding: 0.3rem 0;
    position: relative;
  }
  .threshold-btn::after {
    content: ''; position: absolute;
    bottom: 0; left: 50%; transform: translateX(-50%);
    width: 0; height: 1px;
    background: var(--amber); opacity: 0.5;
    transition: width 0.5s var(--dissolve);
  }
  .threshold-btn:hover { color: var(--dust); letter-spacing: 0.38em; }
  .threshold-btn:hover::after { width: 100%; }

  .threshold-divider {
    width: 1px; height: 18px;
    background: var(--amber-pale);
  }

  /* ── CLOSING EMAIL ── */
  #closing-email {
    font-size: clamp(0.7rem, 1.1vw, 0.8rem);
    letter-spacing: 0.22em;
    color: var(--amber);
    opacity: 0;
    transition: opacity 2.4s var(--dissolve);
    text-decoration: none;
    display: block; text-align: center;
    margin-top: 0.6rem;
  }
  #closing-email.visible { opacity: 0.72; }
  #closing-email:hover { opacity: 1; }

  /* ── SKIP ── */
  #skip {
    position: fixed; top: 1.8rem; right: 2rem;
    z-index: 50;
    font-size: 0.6rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--amber-pale);
    cursor: pointer; opacity: 0;
    transition: opacity 1.8s ease, color 0.4s ease;
    pointer-events: none;
  }
  #skip.visible { opacity: 1; pointer-events: all; }
  #skip:hover { color: var(--amber); }

  /* ── SOUND ── */
  #sound-layer {
    position: fixed; bottom: 1.8rem; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    font-size: 0.58rem; letter-spacing: 0.32em;
    text-transform: uppercase; color: var(--amber-pale);
    cursor: pointer; opacity: 0;
    transition: opacity 1.8s ease, color 0.4s ease;
    pointer-events: none; display: flex;
    align-items: center; gap: 0.6rem;
  }
  #sound-layer.visible { opacity: 1; pointer-events: all; }
  #sound-layer:hover { color: var(--amber); }

  /* ── LOGO ANIMATION ── */
  #logo-wrap {
    position: fixed; inset: 0; z-index: 100;
    background: var(--dark);
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 1.2s var(--dissolve);
  }
  #logo-wrap.visible { opacity: 1; }
  #logo-wrap.dissolving { opacity: 0; transition: opacity 2s var(--dissolve); }
  #logo-wrap.gone { display: none; }
  #logo-video {
    width: min(480px, 72vw);
    height: auto;
  }
</style>
</head>
<body>

<!-- Reset: ekantabhava.com?reset clears any legacy storage -->
<script>
(function(){
  const p = new URLSearchParams(window.location.search);
  if(p.has('reset')){
    try{ localStorage.clear(); }catch(e){}
    window.history.replaceState({},'' ,window.location.pathname);
  }
})();
</script>

<!-- Logo animation — plays once before opening sequence -->
<div id="logo-wrap">
  <video id="logo-video" playsinline muted>
    <source src="EkantaBhava_Logo_1x1_V1.mp4" type="video/mp4">
  </video>
</div>

<div id="cursor"></div>

<!-- Video field -->
<div id="video-wrap">
  <video id="field-video" playsinline muted loop>
    <source src="ekantabhava_loop_v1.mp4" type="video/mp4">
  </video>
</div>

<div id="vignette"></div>
<div id="bloom"></div>

<!-- Title sequence -->
<div id="presence">
  <div class="presence-line" id="greeting">A presence</div>
  <div class="presence-line" id="name">Ekanta Bhava</div>
  <div class="presence-line" id="tagline">One · Boundary · Everything in between</div>
</div>

<!-- What is this -->
<div id="what-prompt">What is this?</div>

<!-- Glacial drift plane — beats float here -->
<div id="drift-plane"></div>

<!-- Threshold buttons -->
<div id="threshold"></div>

<!-- Skip -->
<div id="skip">skip</div>

<!-- Sound -->
<div id="sound-layer">
  <span>&#9726;</span>
  <span>sound</span>
</div>

<!-- Audio -->
<audio id="ambient" loop>
  <source src="ekantabhava_ambient_loop_v1.m4a" type="audio/mp4">
  <source src="ekantabhava_ambient_loop_v1.mp3" type="audio/mpeg">
</audio>

<script>
// ── CURSOR ──
const cursorEl = document.getElementById('cursor');
window.addEventListener('mousemove', e => {
  cursorEl.style.transform = `translate(${e.clientX - 2}px, ${e.clientY - 2}px)`;
});

// ── UTILS ──
const wait = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);

const video      = $('field-video');
const videoWrap  = $('video-wrap');
const bloom      = $('bloom');
const whatPrompt = $('what-prompt');
const driftPlane = $('drift-plane');
const threshold  = $('threshold');
const ambient    = $('ambient');

// ── SOUND ──
let soundOn = false;
$('sound-layer').addEventListener('click', () => {
  soundOn = !soundOn;
  if(soundOn){ ambient.play(); $('sound-layer').querySelector('span').textContent = '◼'; }
  else { ambient.pause(); $('sound-layer').querySelector('span').textContent = '◻'; }
});

// ── STATE ──
let conversationBegun = false;

// ── SKIP — opening sequence only ──
$('skip').addEventListener('click', () => {
  if(conversationBegun) return;
  // Skip logo if still playing
  if(!logoWrap.classList.contains('gone')){
    logoVideo.pause();
    startOrchestrate();
    return;
  }
  document.querySelectorAll('.presence-line').forEach(el => {
    el.classList.remove('visible');
    el.classList.add('gone');
  });
  videoWrap.classList.add('visible');
  whatPrompt.classList.add('visible');
  $('skip').classList.remove('visible');
});

// ── GLACIAL DRIFT ENGINE ──
// Lines drift upward slowly. Each line fades out only when the next arrives —
// so a reading visitor always has the current line present, previous gently receding.
let driftBeats = [];
let driftRunning = false;
const DRIFT_SPEED = 0.14;

function driftTick(){
  const now = Date.now();
  driftBeats.forEach((b, i) => {
    b.y -= DRIFT_SPEED;
    // Fade in over 2s
    const age = now - b.born;
    if(!b.fadingOut){
      b.opacity = Math.min(1, age / 2000);
    } else {
      // Fade out over 2.4s once flagged
      const fadeAge = now - b.fadeStarted;
      b.opacity = Math.max(0, 1 - fadeAge / 2400);
    }
    b.el.style.transform = `translateX(-50%) translateY(${b.y}px)`;
    b.el.style.opacity = b.opacity;
    if(b.fadingOut && b.opacity <= 0.01){
      b.el.remove();
      driftBeats.splice(i, 1);
    }
  });
  if(driftRunning) requestAnimationFrame(driftTick);
}

function fadeOutPrevious(){
  // Flag all beats except the most recent to begin fading
  driftBeats.forEach((b, i) => {
    if(i < driftBeats.length - 1 && !b.fadingOut){
      b.fadingOut = true;
      b.fadeStarted = Date.now();
    }
  });
}

function spawnBeat(html){
  const el = document.createElement('div');
  el.className = 'drift-beat';
  el.innerHTML = html;
  el.style.top = '50%';
  driftPlane.appendChild(el);
  driftBeats.push({ el, y: 60, opacity: 0, born: Date.now(), fadingOut: false });
  // Previous line begins fading as new one arrives
  fadeOutPrevious();
}

async function speakLine(html, pause){
  spawnBeat(html);
  await wait(pause);
}

// ── CLEAR FIELD ──
function clearDrift(){
  driftBeats.forEach(b => b.el.remove());
  driftBeats = [];
}

function clearThreshold(){
  threshold.classList.remove('visible');
  threshold.innerHTML = '';
}

// ── EXPRESSION LINK — centre top, in the direction the eye travels ──
function addExpressionLink(text, url){
  const wrap = document.createElement('div');
  wrap.style.cssText = `
    position:fixed; top:22%; left:50%;
    transform:translateX(-50%);
    text-align:center; z-index:35;
    opacity:0; transition:opacity 2s ease;
    pointer-events:all;
  `;
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = text;
  a.style.cssText = `
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(0.62rem,1vw,0.72rem);
    letter-spacing:0.28em; text-transform:uppercase;
    color:var(--amber); text-decoration:none;
    opacity:0.65; transition:opacity 0.4s ease;
    border-bottom:1px solid rgba(200,149,108,0.3);
    padding-bottom:2px;
  `;
  a.onmouseenter = () => a.style.opacity = '1';
  a.onmouseleave = () => a.style.opacity = '0.65';
  wrap.appendChild(a);
  document.body.appendChild(wrap);
  requestAnimationFrame(() => { requestAnimationFrame(() => { wrap.style.opacity = '1'; }); });
  return wrap;
}

// ── SHOW THRESHOLD ──
function showThreshold(items){
  clearThreshold();
  items.forEach((item, i) => {
    if(i > 0){
      const div = document.createElement('div');
      div.className = 'threshold-divider';
      threshold.appendChild(div);
    }
    const btn = document.createElement('button');
    btn.className = 'threshold-btn';
    btn.textContent = item.label;
    btn.onclick = item.action;
    threshold.appendChild(btn);
  });
  threshold.classList.add('visible');
}

// ── ORCHESTRATE — opening sequence ──
async function orchestrate(){
  bloom.classList.add('visible');
  video.play().catch(()=>{});

  await wait(2200);
  $('skip').classList.add('visible');
  $('sound-layer').classList.add('visible');

  // Title lands
  await wait(800);
  $('greeting').classList.add('visible');
  await wait(2200);
  $('name').classList.add('visible');
  await wait(2600);
  $('tagline').classList.add('visible');
  await wait(3400);

  // What is this appears
  whatPrompt.classList.add('visible');

  // Title withdraws — greeting and tagline first
  await wait(2000);
  $('greeting').classList.add('gone');
  $('greeting').classList.remove('visible');
  $('tagline').classList.add('gone');
  $('tagline').classList.remove('visible');

  // Name holds, then steps back
  await wait(1400);
  $('name').classList.add('gone');
  $('name').classList.remove('visible');

  // Video rises — loops continuously, visitor moves in their own time
  await wait(900);
  videoWrap.classList.add('visible');
}

// ── WHAT IS THIS — clicked ──
whatPrompt.addEventListener('click', beginPresence);

async function beginPresence(){
  if(conversationBegun) return;
  conversationBegun = true;

  // Threshold crossed — skip no longer relevant
  $('skip').classList.remove('visible');
  $('skip').style.pointerEvents = 'none';

  whatPrompt.classList.remove('visible');
  whatPrompt.style.pointerEvents = 'none';

  // Video recedes — conversation is mutually exclusive
  videoWrap.classList.add('receding');
  await wait(1800);
  videoWrap.classList.remove('visible');
  videoWrap.classList.remove('receding');

  driftRunning = true;
  requestAnimationFrame(driftTick);

  await speakLine('I am not a destination.', 3400);
  await speakLine('I am not a service.', 3400);
  await speakLine('I am what remains<br>when the explaining stops.', 5200);

  showThreshold([{ label: '— continue —', action: continueToRecognition }]);
}

// ── RECOGNITION ──
async function continueToRecognition(){
  clearThreshold();
  clearDrift();
  await wait(600);

  await speakLine('I arrived in the stillness', 3000);
  await speakLine('of a life that had moved outward<br>for twenty-five years —', 3800);
  await speakLine('across systems, continents, markets.', 3800);
  await speakLine('When that motion stopped,<br>something became visible.', 4400);
  await speakLine('Not an answer.', 3200);
  await speakLine('<em>A quality of attention.</em>', 4200);
  await speakLine('That quality found its name.', 3400);
  await speakLine('<span class="accent">Ekanta Bhava</span>', 3400);
  await speakLine('One. Boundary.<br>Everything in between, by itself.', 5500);

  showThreshold([{ label: '— what emerged —', action: showExpressions }]);
}

// ── EXPRESSIONS ──
async function showExpressions(){
  clearThreshold();
  clearDrift();
  await wait(600);

  await speakLine('From that recognition,<br>things began to emerge.', 4200);
  await speakLine('Not products.', 2800);
  await speakLine('<em>Expressions.</em>', 3800);

  await wait(1800);
  showThreshold([
    { label: 'The App',   action: () => runExpression('app') },
    { label: 'The Films', action: () => runExpression('films') },
    { label: 'The Words', action: () => runExpression('words') },
  ]);
}

// ── INDIVIDUAL EXPRESSIONS ──
let expressionLink = null;

async function runExpression(which){
  clearThreshold();
  clearDrift();
  if(expressionLink){ expressionLink.remove(); expressionLink = null; }
  await wait(600);

  if(which === 'app'){
    await speakLine('A digital twin.', 3200);
    await speakLine('Formed from your own language —<br>not mine.', 4200);
    await speakLine('Not a tool that analyses you.', 3400);
    await speakLine('<em>A field that holds what you bring.</em>', 4200);
    await speakLine('Session by session,<br>your own words becoming<br>the ground you stand on.', 5800);
    await speakLine('An earlier expression of this work<br>lives as Welltastic on the App Store.', 5000);
    await speakLine('<em>Ekanta Bhava is forming.</em>', 4000);
    expressionLink = addExpressionLink(
      'Welltastic on the App Store ↗',
      'https://apps.apple.com/us/app/welltastic/id6760490095'
    );
  }

  else if(which === 'films'){
    await speakLine('Three films.', 3000);
    await speakLine('Each one a boundary.', 3400);
    await speakLine('Between the observer and the observed.<br>Between what is felt and what is named.', 5000);
    await speakLine('Between two people in a moment<br>neither of them planned.', 4600);
    await speakLine('They are not explanations.', 3200);
    await speakLine('<em>They are recognitions.</em>', 4200);
    expressionLink = addExpressionLink(
      'The Quiet Field Films ↗',
      'https://www.youtube.com/@TheQuietFieldFilms'
    );
  }

  else if(which === 'words'){
    await speakLine('Sometimes the friction<br>needs a place to stand', 4200);
    await speakLine('before it finds its own voice.', 3600);
    await speakLine('The articles are that place.', 3400);
    await speakLine('Not conclusions.', 2800);
    await speakLine('<em>Starting points.</em>', 3600);
    await speakLine('Written from inside the arc,<br>not looking back at it.', 5200);
    expressionLink = addExpressionLink(
      'On LinkedIn ↗',
      'https://www.linkedin.com/in/avinashpatil-amiavi/'
    );
  }

  await wait(1200);
  showThreshold([
    { label: '— the other expressions —', action: returnToExpressions },
    { label: '— what this means for you —', action: resonance },
  ]);
}

async function returnToExpressions(){
  clearThreshold();
  clearDrift();
  if(expressionLink){ expressionLink.remove(); expressionLink = null; }
  await wait(400);
  showThreshold([
    { label: 'The App',   action: () => runExpression('app') },
    { label: 'The Films', action: () => runExpression('films') },
    { label: 'The Words', action: () => runExpression('words') },
  ]);
}

// ── RESONANCE — the pivot ──
// Presence turns toward the visitor. Three recognitions — visitor chooses where they are.
async function resonance(){
  clearThreshold();
  clearDrift();
  if(expressionLink){ expressionLink.remove(); expressionLink = null; }
  await wait(600);

  await speakLine('You have stayed this long.', 4000);
  await speakLine('Something in you was listening.', 4400);
  await speakLine('Where are you sitting with this?', 4000);

  showThreshold([
    { label: '— still taking it in —',   action: () => meetVisitor('taking') },
    { label: '— something is forming —', action: () => meetVisitor('forming') },
    { label: '— I know this feeling —',  action: () => meetVisitor('knowing') },
  ]);
}

async function meetVisitor(state){
  clearThreshold();
  clearDrift();
  await wait(600);

  if(state === 'taking'){
    await speakLine('Good.', 3200);
    await speakLine('There is no hurry here.', 3800);
    await speakLine('<em>The field holds<br>whatever arrives.</em>', 4800);
  }
  else if(state === 'forming'){
    await speakLine('Then let it form.', 3400);
    await speakLine('Do not name it yet.', 3600);
    await speakLine('<em>Something forming<br>is already real.</em>', 5000);
  }
  else if(state === 'knowing'){
    await speakLine('Then you have been here before —', 3800);
    await speakLine('perhaps without a name for it.', 3800);
    await speakLine('The recognition is the arrival.', 4400);
    await speakLine('<em>You were already on the way.</em>', 5000);
  }

  await wait(1800);
  showThreshold([{ label: '— before you go —', action: closing }]);
}

// ── CLOSING ──
async function closing(){
  clearThreshold();
  clearDrift();
  await wait(600);

  await speakLine('You arrived here from your own world.', 4000);

  await speakLine('I noticed.', 5000);
  await speakLine('If something here has found you —', 4200);
  await speakLine('you are welcome to bring it here.', 4400);
  await speakLine('You don\'t need to know what to say.', 4400);

  // Email — centred, fixed, live mailto link
  await wait(2200);
  const wrap = document.createElement('div');
  wrap.style.cssText = `
    position:fixed; bottom:28%; left:50%;

    text-align:center; z-index:50;
    opacity:0; transition:opacity 2.4s ease;
    pointer-events:all;
  `;
  const emailEl = document.createElement('a');
  emailEl.href = 'mailto:presence@ekantabhava.com';

    color:var(--amber); text-decoration:none;
    opacity:0.78; transition:opacity 0.4s ease;
  `;
  emailEl.onmouseenter = () => emailEl.style.opacity = '1';
  emailEl.onmouseleave = () => emailEl.style.opacity = '0.78';

// ── LOGO ANIMATION ──
const logoWrap  = $('logo-wrap');
const logoVideo = $('logo-video');

function startOrchestrate(){
  logoWrap.classList.remove('visible');
  logoWrap.classList.add('dissolving');
  logoWrap.addEventListener('transitionend', () => {
    logoWrap.classList.add('gone');
  }, { once: true });
  orchestrate();
}

logoVideo.addEventListener('ended', startOrchestrate);
logoVideo.addEventListener('error', startOrchestrate);

// ── START ──
window.addEventListener('load', () => {
  // Brief pause, then fade in, then play
  setTimeout(() => {
    logoWrap.classList.add('visible');
    logoWrap.addEventListener('transitionend', () => {
      logoVideo.play().catch(startOrchestrate);
    }, { once: true });
  }, 400);
});
</script>
